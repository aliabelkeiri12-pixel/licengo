# Démo GRATUITE (offre Free de Render) : https://dashboard.render.com → New → Blueprint → ce dépôt.
# Limites du gratuit : le site s'endort après 15 min sans visite (≈1 min pour se réveiller),
# base gratuite valable 30 jours, documents envoyés non conservés après un redémarrage,
# pas de tâche planifiée. Pour la version officielle payante : docs/render-production.yaml.
databases:
  - name: licengo-demo-db
    region: frankfurt
    plan: free
    databaseName: licengo
    user: licengo

services:
  - type: web
    name: licengo-demo
    runtime: docker
    region: frankfurt
    plan: free
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: licengo-demo-db, property: connectionString }
      - key: DOCUMENT_ENCRYPTION_KEY
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: STORAGE_DIR
        value: /tmp/storage
      - key: DEMO_DATA
        value: "1"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
