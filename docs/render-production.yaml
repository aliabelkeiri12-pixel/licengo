# Déploiement en un clic : https://dashboard.render.com → New → Blueprint → choisir ce dépôt.
databases:
  - name: licengo-db
    region: frankfurt
    plan: basic-256mb
    databaseName: licengo
    user: licengo

services:
  - type: web
    name: licengo
    runtime: docker
    region: frankfurt
    plan: starter
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    healthCheckPath: /api/health
    disk:
      name: documents
      mountPath: /data/storage
      sizeGB: 5
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: licengo-db, property: connectionString }
      - key: DOCUMENT_ENCRYPTION_KEY
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: BREVO_API_KEY # emails (reçus de paiement) – compte gratuit brevo.com
        sync: false
      - key: MAIL_FROM # adresse d'expéditeur validée dans Brevo
        sync: false
      - key: LICENGO_LEGAL_NAME # identité légale imprimée sur les factures de frais de service
        sync: false
      - key: LICENGO_ADDRESS
        sync: false
      - key: LICENGO_SIREN
        sync: false
      - key: LICENGO_VAT_NUMBER
        sync: false
      - key: DEMO_DATA
        value: "1"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

  - type: cron
    name: licengo-echeances
    runtime: docker
    region: frankfurt
    plan: starter
    schedule: "15 5 * * *"
    dockerfilePath: ./deploy/Dockerfile.cron
    dockerContext: .
    envVars:
      - key: CRON_SECRET
        fromService: { type: web, name: licengo, envVarKey: CRON_SECRET }
      - key: APP_INTERNAL_URL
        fromService: { type: web, name: licengo, property: hostport }
