name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: licengo, POSTGRES_PASSWORD: licengo, POSTGRES_DB: licengo_test }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://licengo:licengo@localhost:5432/licengo_test
      DOCUMENT_ENCRYPTION_KEY: Zm9yLWRldmVsb3BtZW50LW9ubHktY2hhbmdlLW1lLSE=
      CRON_SECRET: ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @licengo/web exec prisma generate
      - run: pnpm typecheck
      - run: pnpm --filter @licengo/core test
      - run: pnpm --filter @licengo/web test
      - run: pnpm --filter @licengo/web build
      - name: E2E
        run: |
          npm i -g playwright@1.65.0 && playwright install --with-deps chromium
          export NODE_PATH=$(npm root -g) && cd apps/web
          DATABASE_URL=postgresql://licengo:licengo@localhost:5432/licengo_test npx prisma migrate deploy
          DATABASE_URL=postgresql://licengo:licengo@localhost:5432/licengo_test pnpm db:seed
          cp -r .next/static .next/standalone/apps/web/.next/ && cp -r public .next/standalone/apps/web/
          (DATABASE_URL=postgresql://licengo:licengo@localhost:5432/licengo_test STORAGE_DIR=/tmp/storage node .next/standalone/apps/web/server.js &) && sleep 5
          SHOTS_DIR=/tmp/shots node e2e/run.mjs

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target runner -t licengo-web:ci .
      - run: docker build --target migrate -t licengo-migrate:ci .
